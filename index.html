<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme School Iniciar Sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Acme School</h1>
    <p>Plataforma de Exámenes en Línea</p>
  </header>

  <main>
    <section id="login-section">
      <h2>Iniciar Sesión</h2>
      <form id="login-form">
        <div>
          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" name="email" placeholder="estudiante@acmeschool.edu" required>
        </div>

        <div>
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit">Ingresar</button>
      </form>
      <p id="error-message" role="alert"></p>
    </section>
  </main>

  <footer>
    <p>2026 Acme School</p>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
</html>
